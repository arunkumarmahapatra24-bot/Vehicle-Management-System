<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2744">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FleetProof">
<title>FleetProof — Vehicle compliance · MHIPL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231a2744%22/%3E%3Crect%20x%3D%226%22%20y%3D%2222%22%20width%3D%2252%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23c0392b%22%20stroke-width%3D%223%22/%3E%3Crect%20x%3D%226%22%20y%3D%2222%22%20width%3D%229%22%20height%3D%2220%22%20fill%3D%22%231747a6%22/%3E%3Cpath%20d%3D%22M22%2032l5%205%2011-11%22%20stroke%3D%22%231d8a4b%22%20stroke-width%3D%224%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2744;--navy2:#243158;--navy3:#33416b;--red:#c0392b;--red2:#a5301f;
  --bg:#eef1f5;--card:#ffffff;--line:#d9e0ea;--line2:#c3ccd9;
  --ink:#18202f;--ink2:#4c5870;--ink3:#7d889c;
  --exp:#c0392b;--d7:#d9531e;--d15:#e0860b;--d30:#b89100;--ok:#1d8a4b;--na:#7d889c;
  --exp-bg:#fbe9e7;--d7-bg:#fdeee5;--d15-bg:#fdf3e1;--d30-bg:#faf5dc;--ok-bg:#e5f4eb;--na-bg:#eef1f5;
  --r:10px;--rs:6px;
  --fb:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
  --fc:"Barlow Condensed","Arial Narrow",Calibri,sans-serif;
  --side:232px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--navy2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Shell ── */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex-shrink:0;background:var(--navy);color:#dfe5f1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;border-right:4px solid var(--red)}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-family:var(--fc);font-weight:700;font-size:25px;letter-spacing:.5px;color:#fff;line-height:1}
.brand span{font-size:12px;color:#9eabc6}
.nav{flex:1;overflow-y:auto;padding:8px 8px 16px}
.nav h6{font-size:11px;font-weight:700;color:#7f8db0;padding:14px 10px 4px;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);color:#d3dbea;text-decoration:none;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:#fff;color:var(--navy);font-weight:700}
.nav a i{font-style:normal;width:20px;text-align:center}
.nav a em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:var(--red);color:#fff;border-radius:10px;padding:0 7px}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;display:flex;align-items:center;gap:8px}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{color:#93a1bf;font-size:12px}
.side-foot button{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:6px;padding:6px 9px;cursor:pointer}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 22px;min-height:58px}
.top h1{font-family:var(--fc);font-size:24px;font-weight:700;letter-spacing:.2px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:4px 6px}
.sitepick{border:1px solid var(--line2);border-radius:var(--rs);padding:6px 8px;background:#fff;font-weight:700;color:var(--navy);max-width:150px}
.syncchip{font-size:12.5px;padding:5px 10px;border-radius:20px;background:var(--na-bg);color:var(--ink2);cursor:pointer;border:1px solid var(--line);white-space:nowrap}
.syncchip.ok{background:var(--ok-bg);color:var(--ok);border-color:#bfe3cc}
.syncchip.bad{background:var(--exp-bg);color:var(--exp);border-color:#f0c4be}
.syncchip.busy{color:var(--navy2)}
.page{padding:22px;max-width:1280px;width:100%}
.banner{border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.banner.warn{background:var(--d15-bg);border-color:#efd3a2;color:#7a4a00}
.banner.bad{background:var(--exp-bg);border-color:#f0c4be;color:#8a2316}
.banner.info{background:#e8eef9;border-color:#c9d6ef;color:var(--navy2)}
.banner .grow{flex:1}

/* ── Bottom tabs (mobile) ── */
.tabs{display:none}
.fab{display:none}

/* ── Primitives ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:var(--rs);padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--navy3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy2)}
.btn.ghost:hover{background:#e8edf5}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px}
.card h3{font-family:var(--fc);font-size:19px;font-weight:700;color:var(--navy);letter-spacing:.2px}
.card .sub{font-size:13px;color:var(--ink3)}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.hdr h3{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--ink3)}
.small{font-size:13px}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.empty{padding:34px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:17px;color:var(--navy);margin-bottom:4px}
.empty .row{justify-content:center;margin-top:14px}

/* status pills */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.exp{background:var(--exp-bg);color:var(--exp)}
.st.d7{background:var(--d7-bg);color:var(--d7)}
.st.d15{background:var(--d15-bg);color:var(--d15)}
.st.d30{background:var(--d30-bg);color:var(--d30)}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.na{background:var(--na-bg);color:var(--na)}
.c-exp{color:var(--exp)}.c-d7{color:var(--d7)}.c-d15{color:var(--d15)}.c-d30{color:var(--d30)}.c-ok{color:var(--ok)}.c-na{color:var(--na)}

/* ── The number plate ── */
.plate{display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:6px;background:#fff;color:#111;font-family:var(--fc);font-weight:700;letter-spacing:1.5px;line-height:1;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #b9bec7;overflow:hidden;white-space:nowrap}
.plate.yel{background:#f7d117;box-shadow:inset 0 0 0 2px #f7d117,inset 0 0 0 3px #8a7400}
.plate .ind{background:#1747a6;color:#fff;font-size:.42em;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .35em;gap:.15em}
.plate .ind::before{content:"";width:1.1em;height:1.1em;border-radius:50%;border:1.5px solid #fff;opacity:.85}
.plate .no{padding:.18em .45em .12em;font-size:1em}
.plate.s{font-size:18px}.plate.m{font-size:26px}.plate.l{font-size:44px}

/* ── Overview ── */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr);gap:16px;margin-bottom:16px}
.scorebox{background:var(--navy);color:#fff;border-radius:var(--r);padding:20px 22px;position:relative;overflow:hidden;border-bottom:5px solid var(--red)}
.scorebox .lbl{font-size:14px;color:#b6c1da}
.scorebox .big{font-family:var(--fc);font-size:88px;font-weight:700;line-height:.95;margin:6px 0 4px}
.scorebox .big small{font-size:40px;color:#b6c1da}
.scorebox .meta{font-size:14px;color:#dbe2ef}
.scorebox .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden;display:flex}
.scorebox .bar i{display:block;height:100%}
.buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bk{padding:16px 16px 14px;border-right:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit;display:block;border-top:5px solid}
.bk:last-child{border-right:0}
.bk:hover{background:#f7f9fc}
.bk .n{font-family:var(--fc);font-size:52px;font-weight:700;line-height:1}
.bk .t{font-weight:700;font-size:14.5px;margin-top:2px}
.bk .d{font-size:12.5px;color:var(--ink3)}
.bk.exp{border-top-color:var(--exp)}.bk.exp .n{color:var(--exp)}
.bk.d7{border-top-color:var(--d7)}.bk.d7 .n{color:var(--d7)}
.bk.d15{border-top-color:var(--d15)}.bk.d15 .n{color:var(--d15)}
.bk.d30{border-top-color:var(--d30)}.bk.d30 .n{color:var(--d30)}

/* lists */
.list{list-style:none}
.li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .what{flex:1;min-width:0}
.li .what b{display:block;font-size:14.5px}
.li .what span{font-size:13px;color:var(--ink3)}
.li .days{font-family:var(--fc);font-size:22px;font-weight:700;text-align:right;min-width:70px;line-height:1}
.li .days small{display:block;font-family:var(--fb);font-size:11.5px;font-weight:400;color:var(--ink3)}
.li.click{cursor:pointer}
.li.click:hover{background:#f7f9fc}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:700;color:var(--ink2);padding:9px 12px;border-bottom:2px solid var(--line);background:#f6f8fb;white-space:nowrap;position:sticky;top:0}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#f7f9fc}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:5px;background:#e3e8f0;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;border-radius:5px}

/* fleet cards */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line2);border-radius:var(--rs);background:#fff;font-size:15px}
.search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);font-size:19px;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.x{border-style:dashed}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;border-left:5px solid var(--na)}
.vc:hover{border-color:var(--line2)}
.vc.exp{border-left-color:var(--exp)}.vc.d7{border-left-color:var(--d7)}.vc.d15{border-left-color:var(--d15)}.vc.d30{border-left-color:var(--d30)}.vc.ok{border-left-color:var(--ok)}
.vc .ph{height:120px;background:#dfe5ee center/cover no-repeat;display:flex;align-items:flex-end;padding:10px}
.vc .ph.none{background:linear-gradient(160deg,#e6ebf2,#d3dbe7);align-items:center;justify-content:center}
.vc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.vc .ln{font-size:13.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vc .sel{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:6px;background:#fff;border:2px solid var(--line2);display:grid;place-items:center;font-weight:700;color:#fff;z-index:2}
.vc.picked{outline:3px solid var(--navy2)}
.vc.picked .sel{background:var(--navy2);border-color:var(--navy2)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.dot.exp{background:var(--exp);color:#fff}.dot.d7{background:var(--d7);color:#fff}.dot.d15{background:var(--d15);color:#fff}.dot.d30{background:var(--d30-bg);color:var(--d30)}.dot.ok{background:var(--ok-bg);color:var(--ok)}.dot.na{background:var(--na-bg);color:var(--na)}
.badge100{font-size:12px;font-weight:700;background:var(--ok);color:#fff;border-radius:4px;padding:1px 7px}
.batch{position:sticky;bottom:12px;z-index:20;background:var(--navy);color:#fff;border-radius:var(--r);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;box-shadow:0 8px 24px rgba(26,39,68,.3)}
.batch .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.batch .btn.red{background:var(--red);border-color:var(--red)}

/* vehicle detail */
.vhead{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;margin-bottom:16px}
.vphoto{border-radius:var(--r);background:#dfe5ee center/cover no-repeat;min-height:200px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;margin-top:14px}
.kv div span{display:block;font-size:12.5px;color:var(--ink3)}
.kv div b{font-size:15px}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cert{border:1px solid var(--line);border-radius:var(--rs);padding:12px;border-top:4px solid var(--na);background:#fff}
.cert.exp{border-top-color:var(--exp)}.cert.d7{border-top-color:var(--d7)}.cert.d15{border-top-color:var(--d15)}.cert.d30{border-top-color:var(--d30)}.cert.ok{border-top-color:var(--ok)}
.cert .ct{display:flex;align-items:center;gap:6px}
.cert .ct b{flex:1;font-size:15px}
.cert .dd{font-family:var(--fc);font-size:34px;font-weight:700;line-height:1;margin:8px 0 2px}
.cert .dd small{font-size:15px;font-family:var(--fb);font-weight:400;color:var(--ink3)}
.cert .meta{font-size:13px;color:var(--ink2)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox svg,.qrbox img{width:190px;height:190px;background:#fff}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);border-radius:var(--rs);padding:9px 10px;background:#fff;font-size:15px}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:12px;color:var(--ink3);margin-top:3px}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px}
.rep{border:1px solid var(--line);border-radius:var(--rs);padding:12px;background:#f8fafc;margin-bottom:10px;position:relative}
.rep .form{grid-template-columns:repeat(3,minmax(0,1fr))}
.rep .x{position:absolute;top:6px;right:6px}
.stabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.stabs button{background:none;border:0;padding:9px 14px;font-weight:700;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.stabs button.on{color:var(--navy);border-bottom-color:var(--red)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(14,22,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.md{background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.md.wide{max-width:920px}
.md .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.md .mh h3{flex:1;font-family:var(--fc);font-size:21px;color:var(--navy)}
.md .mb{padding:16px 18px;overflow-y:auto}
.md .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grip{display:none}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.tst.bad{background:var(--red)}
.tst.good{background:var(--ok)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:12.5px;font-weight:700;color:var(--ink2);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#f6f8fb}
.cal .dc{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:3px}
.cal .dc:hover{background:#f7f9fc}
.cal .dc.out{background:#f8f9fb;color:var(--ink3)}
.cal .dc.today .dn{background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .dc.sel{outline:2px solid var(--navy2);outline-offset:-2px}
.cal .dn{font-weight:700;font-size:13.5px}
.cal .ev{font-size:11.5px;font-weight:700;border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.exp{background:var(--exp);color:#fff}.cal .ev.d7{background:var(--d7);color:#fff}.cal .ev.d15{background:var(--d15-bg);color:var(--d15)}.cal .ev.d30{background:var(--d30-bg);color:var(--d30)}.cal .ev.ok{background:#e8eef9;color:var(--navy2)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--fb);font-size:12px;fill:var(--ink2)}

/* gate */
.gate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.cam{position:relative;background:#0f1729;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#9eabc6}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
.verdict{border-radius:var(--r);padding:22px;color:#fff;text-align:center}
.verdict.allow{background:var(--ok)}
.verdict.warn{background:var(--d15)}
.verdict.block{background:var(--exp)}
.verdict .vv{font-family:var(--fc);font-size:64px;font-weight:700;line-height:1;letter-spacing:2px}
.verdict ul{list-style:none;margin-top:10px;font-size:15px;text-align:left;display:inline-block}

/* public view */
.pub{max-width:640px;margin:0 auto;padding:18px 14px 40px}
.pubhead{background:var(--navy);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:14px 16px;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:10px}
.pubhead b{font-family:var(--fc);font-size:22px;flex:1}
.pubhead span{font-size:12.5px;color:#b6c1da}
.pubbody{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:16px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:var(--navy)}
.lbox{background:#fff;border-radius:12px;max-width:390px;width:100%;padding:26px 24px;border-bottom:6px solid var(--red)}
.lbox h2{font-family:var(--fc);font-size:34px;color:var(--navy);line-height:1}
.lbox p{color:var(--ink3);font-size:14px;margin:4px 0 18px}

/* display mode */
.display{background:var(--navy);min-height:100vh;color:#fff;padding:22px}
.display .card{color:var(--ink)}

@media (max-width:1100px){
  .hero{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .side{transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(14,22,40,.45)}
  .main{margin-left:0}
  .burger{display:block}
  .top{padding:8px 12px}
  .top h1{font-size:21px}
  .page{padding:14px 12px 96px}
  .g2,.g3,.gate,.vhead{grid-template-columns:1fr}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:35;padding-bottom:env(safe-area-inset-bottom)}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;font-size:11.5px;font-weight:700;color:var(--ink3);text-decoration:none;position:relative}
  .tabs a i{font-style:normal;font-size:19px}
  .tabs a.on{color:var(--red)}
  .tabs a em{position:absolute;top:2px;left:55%;font-style:normal;background:var(--red);color:#fff;font-size:10px;border-radius:8px;padding:0 5px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--red);color:#fff;font-size:28px;border:0;z-index:36;box-shadow:0 6px 18px rgba(192,57,43,.45);cursor:pointer}
  .buckets{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bk:nth-child(2){border-right:0}
  .bk:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .bk .n{font-size:42px}
  .scorebox .big{font-size:72px}
  .form,.rep .form{grid-template-columns:1fr}
  .fld input,.fld select,.fld textarea{font-size:16px}
  .ov{align-items:flex-end;padding:0}
  .md,.md.wide{max-width:none;border-radius:16px 16px 0 0;max-height:94vh}
  .grip{display:block;width:44px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
  .li{padding:10px 12px;gap:9px}
  .li .plate.s{font-size:13px;letter-spacing:.8px}
  .li .days{min-width:52px;font-size:20px}
  .hdr{padding:12px}
  .pad{padding:14px}
  .sitepick{max-width:110px}
  .syncchip .lbl{display:none}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .cal .dc{min-height:56px;padding:3px}
  .cal .ev{font-size:0;height:6px;padding:0}
  .plate.l{font-size:34px}
}
@media print{
  .side,.top,.tabs,.fab,.batch,.noprint{display:none!important}
  .main{margin:0}
}

S.ff = S.ff || { q: '', depts: [], types: [], driver: '', status: '', within: '', docType: '', src: '', open: false };

function fleetBy(k, v) { S.ff = { q: '', depts: [], types: [], driver: '', status: '', within: '', docType: '', src: '', open: false }; if (k === 'dept') S.ff.depts = [v]; if (k === 'status') S.ff.status = v; go('fleet'); render(); }
function filtered() {
  const f = S.ff, q = f.q.toLowerCase();
  return fleet().filter(v => {
    if (q && ![v.reg, normReg(v.reg), v.make, v.model, v.type, v.dept, driverName(v), v.route, v.location, v.notes, ...(v.certs || []).map(c => c.no)].join(' ').toLowerCase().includes(q)) return false;
    if (f.depts.length && !f.depts.includes(v.dept || 'Unassigned')) return false;
    if (f.types.length && !f.types.includes(v.type || 'Other')) return false;
    if (f.driver && driverName(v) !== f.driver) return false;
    if (f.src && (f.src === 'sheet' ? v.src === 'device' : v.src !== 'device')) return false;
    const st = vstate(v);
    if (f.status === 'good' && !(score(v) === 100)) return false;
    if (f.status === 'attention' && !['d7', 'd15', 'd30'].includes(st)) return false;
    if (f.status === 'expired' && st !== 'exp') return false;
    if (f.status === 'nodata' && st !== 'na') return false;
    if (f.within !== '' || f.docType) {
      const n = f.within === '' ? 99999 : +f.within;
      const hit = items(v).some(i => (!f.docType || i.type === f.docType) && i.days != null && i.days <= n);
      if (!hit) return false;
    }
    return true;
  });
}

/* ════════════ Charts (plain SVG — work offline) ════════════ */
function lineChart(pts, opt = {}) {
  const W = 640, H = 220, L = 38, R = 12, T = 12, B = 30; if (!pts.length) return '';
  const ymin = opt.min ?? 0, ymax = opt.max ?? 100, n = pts.length;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * (H - T - B);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.label || 'Trend') + '">';
  for (let g = 0; g <= 4; g++) { const v = ymin + (ymax - ymin) * g / 4; s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e3e8f0"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + Math.round(v) + '</text>'; }
  const step = Math.max(1, Math.ceil(n / 7));
  pts.forEach((p, i) => { if (i % step === 0 || i === n - 1) s += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(p.l) + '</text>'; });
  s += '<polyline fill="none" stroke="#1a2744" stroke-width="2.5" points="' + pts.map((p, i) => X(i) + ',' + Y(p.v)).join(' ') + '"/>';
  pts.forEach((p, i) => s += '<circle cx="' + X(i) + '" cy="' + Y(p.v) + '" r="' + (n > 40 ? 1.5 : 3.5) + '" fill="#c0392b"><title>' + esc(p.l + ': ' + p.v) + '</title></circle>');
  return s + '</svg>';
}
function barChart(data, opt = {}) {
  const W = 640, rowH = 30, L = opt.left || 140, H = data.length * rowH + 10; if (!data.length) return '<p class="small muted pad">No data yet.</p>';

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.label || 'Bar chart') + '">';
  data.forEach((d, i) => { const y = 5 + i * rowH, w = (W - L - 60) * d.v / max; s += '<text x="' + (L - 8) + '" y="' + (y + 19) + '" text-anchor="end">' + esc(String(d.l).slice(0, 22)) + '</text><rect x="' + L + '" y="' + (y + 5) + '" width="' + Math.max(1, w) + '" height="' + (rowH - 12) + '" rx="3" fill="' + (d.c || '#1a2744') + '"/><text x="' + (L + w + 6) + '" y="' + (y + 19) + '" style="font-weight:700;fill:#18202f">' + d.v + (opt.unit || '') + '</text>'; });
  return s + '</svg>';
}

    t += items(v).map(i => (i.b === 'exp' ? '🔴 ' : ['d7', 'd15'].includes(i.b) ? '🟠 ' : i.b === 'd30' ? '🟡 ' : '🟢 ') + i.label + ': ' + fmtDate(i.expiry) + ' (' + daysText(i.days) + ')').join('\n');

async function renderPublic(qp) {
  shellBuilt = false; stopCam();
  let v = null, err = '';
  try { if (qp.get('v')) v = unpackVehicle(qp.get('v')); } catch (e) { err = 'This QR code is damaged or incomplete.'; }
  const reg = v ? v.reg : qp.get('reg');
  const local = reg && S.fleet.find(x => normReg(x.reg) === normReg(reg));
  if (local) v = local;
  paintPublic(v, err || (!v ? 'Vehicle ' + esc(reg || '') + ' was not found.' : ''), local ? 'This device’s records' : v && v.fromQR ? 'Dates as printed on ' + fmtDate(v.qrAt) : '');
  if (reg && sheetUrl('v') && !local) {
    try {
      const vs = sheetToVehicles(await fetchCSV(sheetUrl('v'))); const sv = vs.find(x => normReg(x.reg) === normReg(reg));
      let drs = []; if (sheetUrl('d')) try { drs = sheetToDrivers(await fetchCSV(sheetUrl('d'))); } catch (e) {}
      if (sv) { S.sheet = { vehicles: [sv], drivers: drs, at: Date.now() }; rebuild(); const mv = S.fleet.find(x => normReg(x.reg) === normReg(reg)); if (mv) paintPublic(mv, '', 'Live from the fleet register · ' + new Date().toLocaleTimeString().slice(0, 5)); }
      else if (/^(inactive|deleted|sold|scrapped)$/i.test(((vs.find(x => normReg(x.reg) === normReg(reg)) || {}).status) || '')) paintPublic(null, fmtReg(reg) + ' is no longer an active fleet vehicle.', '');
    } catch (e) { /* stay on QR data */ }
  }
}

    + '<div class="certs mt">' + its.sort((a, b) => (a.days ?? 1e9) - (b.days ?? 1e9)).map(i => '<div class="cert ' + i.b + '"><div class="ct"><b>' + esc(i.label) + '</b>' + pill(i.b) + '</div><div class="dd c-' + i.b + '">' + (i.days == null ? '—' : Math.abs(i.days)) + ' <small>' + (i.days == null ? 'no expiry' : i.days < 0 ? 'days overdue' : 'days left') + '</small></div><div class="meta">' + (i.expiry ? 'Valid until ' + fmtDate(i.expiry) : '') + (i.no ? '<br>No. ' + esc(i.no) : '') + '</div>' + (i.link ? '<a class="btn sm pri" style="margin-top:8px" target="_blank" rel="noopener" href="' + esc(i.link) + '">View certificate</a>' : '') + '</div>').join('') + '</div>'
    + '<p class="small muted mt" style="text-align:center">' + esc(srcNote || '') + ' · Checked ' + fmtDate(todayISO()) + ' ' + new Date().toTimeString().slice(0, 5) + '</p>'
    + '<div class="row mt" style="justify-content:center"><a class="btn sm ghost" href="' + esc(location.pathname) + '">Staff sign-in</a></div></div></div>';
  document.title = fmtReg(v.reg) + ' — FleetProof';
}

/* ════════════ Display board (TV / kiosk) ════════════ */
function renderDisplay() {

    + '<div class="card"><div class="hdr"><h3>Act now — expired and due within 15 days</h3></div>' + (its.length ? '<ul class="list">' + its.slice(0, 14).map(itemLi).join('') + '</ul>' : '<div class="empty"><b>All clear</b>Nothing expired or due in the next 15 days.</div>') + '</div></div>';
}

/* ════════════ AI document reader ════════════ */
const AI_PROMPT = 'You read Indian vehicle and driver documents (RC, insurance policy, PUC certificate, fitness certificate, road tax receipt, permit, driving licence, fire extinguisher tag). Look at the attached document and reply with ONLY a JSON object, no other text:\n{"doc_type":"RC|Insurance|PUC|Fitness|Road Tax|Permit|Driving licence|Fire extinguisher|Other","number":"certificate, policy, permit or licence number","reg_no":"vehicle registration number","issue_date":"YYYY-MM-DD","expiry_date":"YYYY-MM-DD","owner_name":"","make":"","model":"","vehicle_class":"","year":"","holder_name":"licence holder","licence_categories":"e.g. LMV, HMV, TRANS","confidence":0.0}\nRules: expiry_date is the date the document stops being valid (insurance policy end, PUC valid upto, fitness valid upto, tax paid upto, licence valid till — for a licence with separate non-transport and transport validity, use the transport date if the holder drives commercial vehicles, otherwise non-transport). Use null for anything not visible. Convert all dates to YYYY-MM-DD.';
function openScanner(onResult, title) {
  const s = S.settings, hasKey = !!s.aiKey;
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov2'; ov.style.zIndex = 150;
  ov.innerHTML = '<div class="md"><div class="grip"></div><div class="mh"><h3>' + esc(title || 'Read a document') + '</h3><button class="btn ghost sm" onclick="$(\'#ov2\').remove()" aria-label="Close">✕</button></div><div class="mb">'
    + fld('Photo or PDF of the document', '<input type="file" id="scf" accept="image/*,application/pdf" capture="environment">') + '<div id="scprev" class="mt"></div>'
    + (hasKey ? '<p class="small muted mt">Read by ' + (s.aiProvider === 'claude' ? 'Claude' : 'Gemini') + ' using the key saved on this device. Check the result before saving.</p>'
      : '<div class="banner info mt"><span>ⓘ</span><div class="grow small">No AI key saved, so use copy-and-paste: copy the prompt, open Gemini, ChatGPT or Claude, attach the photo, send, then paste the reply below. Save a key in Settings to do this in one tap.</div></div><div class="row"><button class="btn sm" onclick="copyText(AI_PROMPT)">Copy prompt</button></div>' + fld('Paste the AI’s reply', '<textarea id="scpaste" placeholder=\'{"doc_type":"PUC", …}\'></textarea>', 'mt'))
    + '<div id="scout" class="mt"></div></div><div class="mf"><button class="btn" onclick="$(\'#ov2\').remove()">Cancel</button><button class="btn pri" id="scgo">' + (hasKey ? 'Read document' : 'Use pasted reply') + '</button></div></div>';
  document.body.appendChild(ov);
  let payload = null;
  $('#scf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.type === 'application/pdf') { payload = { mime: 'application/pdf', data: await fileB64(f) }; $('#scprev').innerHTML = '<p class="small">📄 ' + esc(f.name) + '</p>'; }
    else { const d = await shrinkImage(f, 1600, .85); payload = { mime: 'image/jpeg', data: d.split(',')[1] }; $('#scprev').innerHTML = '<img src="' + d + '" style="max-width:100%;max-height:220px;border-radius:6px">'; }
  };
  $('#scgo').onclick = async () => {
    const out = $('#scout');
    try {
      let j;
      if (hasKey) { if (!payload) return toast('Choose a photo first', 'bad'); out.innerHTML = '<p class="small">Reading…</p>'; $('#scgo').disabled = true; j = await aiCall(payload); }
      else { const t = $('#scpaste').value; if (!t.trim()) return toast('Paste the AI’s reply first', 'bad'); j = parseAIJson(t); }
      $('#ov2').remove(); onResult(j);
    } catch (e) { out.innerHTML = '<p class="small c-exp">' + esc(e.message) + '</p>'; $('#scgo').disabled = false; }
  };
}
function fileB64(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); }); }
function parseAIJson(t) { const m = String(t).replace(/```json|```/g, '').match(/\{[\s\S]*\}/); if (!m) throw new Error('No JSON found in the reply'); return JSON.parse(m[0]); }
async function aiCall(p) {
  const s = S.settings;
  if (s.aiProvider === 'claude') {
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': s.aiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: s.aiModel || 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: [{ type: p.mime === 'application/pdf' ? 'document' : 'image', source: { type: 'base64', media_type: p.mime, data: p.data } }, { type: 'text', text: AI_PROMPT }] }] }) });
    const d = await r.json(); if (!r.ok) throw new Error('Claude: ' + ((d.error && d.error.message) || r.status));
    return parseAIJson(d.content.filter(c => c.type === 'text').map(c => c.text).join(''));
  }
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + (s.aiModel || 'gemini-2.5-flash') + ':generateContent?key=' + encodeURIComponent(s.aiKey), { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ inline_data: { mime_type: p.mime, data: p.data } }, { text: AI_PROMPT }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0 } }) });
  const d = await r.json(); if (!r.ok) throw new Error('Gemini: ' + ((d.error && d.error.message) || r.status));
  return parseAIJson(((d.candidates || [])[0] || {}).content.parts.map(x => x.text || '').join(''));
}
const AI_TYPE = t => { t = String(t || ''); const k = S.settings.certTypes.find(x => x.toLowerCase() === t.toLowerCase()); return k || ({ pollution: 'PUC', puc: 'PUC', fc: 'Fitness', tax: 'Road Tax', insurance: 'Insurance' })[t.toLowerCase()] || t; };
function aiScanRow(btn) {
  const row = btn.closest('.rep');
  openScanner(j => { const set = (k, v) => { if (v) $('[data-k=' + k + ']', row).value = v; }; set('type', AI_TYPE(j.doc_type)); set('no', j.number); set('expiry', normDate(j.expiry_date)); set('issue', normDate(j.issue_date)); toast('Filled in — check before saving', 'good'); }, 'Read certificate');
}
function aiScanForm(formId, mode) {
  const f = $('#' + formId);
  openScanner(j => {
    const set = (n, v) => { const el = $('[name=' + n + ']', f); if (el && v && !el.readOnly) el.value = v; };
    if (mode === 'licence') { set('name', j.holder_name); set('lic', j.number); set('cat', j.licence_categories); set('expiry', normDate(j.expiry_date)); set('issue', normDate(j.issue_date)); }
    else { set('type', AI_TYPE(j.doc_type)); set('no', j.number); set('expiry', normDate(j.expiry_date)); set('issue', normDate(j.issue_date)); }
    toast('Filled in — check before saving', 'good');
  }, mode === 'licence' ? 'Read driving licence' : 'Read certificate');
}
function aiScanFor(id) {
  const v = vById(id);
  openScanner(j => {
    if (j.reg_no && normReg(j.reg_no) !== normReg(v.reg)) toast('Heads up: the document says ' + j.reg_no + ', not ' + fmtReg(v.reg), 'bad');
    const t = AI_TYPE(j.doc_type);
    if (t === 'Driving licence') { editDriver(null, j.holder_name || ''); setTimeout(() => { const f = $('#df'); if (!f) return; [['lic', j.number], ['cat', j.licence_categories], ['expiry', normDate(j.expiry_date)], ['issue', normDate(j.issue_date)]].forEach(([n, x]) => { if (x) $('[name=' + n + ']', f).value = x; }); }, 50); return; }
    renewCert(id, null); setTimeout(() => { const f = $('#rf'); [['type', t], ['no', j.number], ['expiry', normDate(j.expiry_date)], ['issue', normDate(j.issue_date)]].forEach(([n, x]) => { if (x) $('[name=' + n + ']', f).value = x; }); }, 50);
    if (t === 'RC' && (j.make || j.model)) { const l = ensureLocal(v); if (!v.make && j.make) l.make = j.make; if (!v.model && j.model) l.model = j.model; if (!v.year && j.year) l.year = j.year; saveLocal(); }
  }, 'Scan a document for ' + fmtReg(v.reg));
}

/* ════════════ RTO / Vahan lookup ════════════ */
async function rtoLookup(id) {
  const v = vById(id), s = S.settings;
  if (!s.rtoUrl) {
    copyText(normReg(v.reg));
    openModal('Check on Parivahan', '<p>The registration <b>' + esc(normReg(v.reg)) + '</b> is copied. On Parivahan choose <b>Know your vehicle details</b> (or use the mParivahan app), paste the number and read off the fitness, insurance, PUC and tax dates.</p><p class="small muted mt">Then press “Scan a document” on a screenshot of the result, or type the dates in with Renew. An RC-verification API can be added in Settings for one-tap filling.</p>',
      '<button class="btn" onclick="closeModal()">Close</button><a class="btn pri" target="_blank" rel="noopener" href="https://parivahan.gov.in/parivahan/" onclick="closeModal()">Open Parivahan</a>');
    return;
  }
  try {
    toast('Asking the RTO service…'); let hd = {}; if (s.rtoHeaders) hd = JSON.parse(s.rtoHeaders);
    const r = await fetch(s.rtoUrl.replace('{reg}', encodeURIComponent(normReg(v.reg))), { headers: hd }); const d = await r.json(); if (!r.ok) throw new Error('Service answered ' + r.status);
    const flat = {}; (function walk(o, p) { if (o && typeof o === 'object') for (const k in o) walk(o[k], k); else if (p) flat[hk(p)] = o; })(d);
    const pick = (...ks) => { for (const k of ks) for (const f in flat) if (f.includes(k) && flat[f]) return flat[f]; return ''; };
    const found = { Fitness: pick('fitupto', 'fitnessupto', 'fitup'), Insurance: pick('insuranceupto', 'insuranceexpiry', 'insurancevalid'), PUC: pick('puccupto', 'pucupto', 'pucexpiry'), 'Road Tax': pick('taxupto', 'taxpaidupto', 'taxvalid'), Permit: pick('permitvalidupto', 'permitupto', 'permitexpiry') };
    const nos = { Insurance: pick('insurancepolicyno', 'policynumber'), PUC: pick('puccnumber', 'pucno'), Permit: pick('permitnumber', 'permitno') };
    const l = ensureLocal(v); let n = 0;
    for (const [t, e] of Object.entries(found)) { const dt = normDate(String(e).slice(0, 10)) || normDate(e); if (!dt) continue; l.certs = (l.certs || []).filter(c => c.type !== t).concat({ id: uid(), type: t, expiry: dt, no: nos[t] || ((v.certs || []).find(c => c.type === t) || {}).no || '', link: ((v.certs || []).find(c => c.type === t) || {}).link || '', src: 'rto' }); n++; }
    const mk = pick('makerdescription', 'maker', 'make'), md = pick('makermodel', 'model'), cl = pick('vehiclecategory', 'vehicleclass', 'classdesc');
    if (mk && !v.make) l.make = mk; if (md && !v.model) l.model = md; if (cl && !v.type) l.type = cl;
    saveLocal(); toast(n ? n + ' dates updated from RTO' : 'The service answered, but no dates were recognised', n ? 'good' : 'bad'); render();
  } catch (e) { toast('RTO lookup failed: ' + e.message, 'bad'); }
}

function loadDemo() {

  const dr = [['K Ramesh', 'AP3920150034567', 'HMV, TRANS', 400, 'Logistics'], ['P Srinivas', 'AP3120180098765', 'LMV', 5, 'Admin'], ['M Appa Rao', 'AP3920120011223', 'HMV, TRANS', -12, 'Production'], ['B Naidu', 'AP3120200045678', 'HGMV', 22, 'Logistics'], ['S Kumar', 'AP3920170067890', 'LMV, TRANS', 190, 'Mechanical']];
  const dIds = dr.map(([name, lic, cat, e, dept]) => { const id = 'd' + uid(); S.localDrivers.push({ id, name, lic, cat, expiry: t(e), issue: t(e - 3650), dept, site: 'VGU', phone: '98' + String(Math.floor(Math.random() * 1e8)).padStart(8, '0'), demo: true }); return id; });

    ['AP 39 DM 0109', 'Tanker', 'BharatBenz', '1617R', 'Mechanical', 4, [1900, -30, -2, 45, -30, 160], 3, 'Water tanker'], ['AP 39 DM 0110', 'Forklift', 'Godrej', 'GX 300', 'Packing', null, [1000, 120, 210, null, null, null], 55, 'Packing plant']
  ];

    STD.forEach((tp, i) => { if (ex[i] == null) return; v.certs.push({ id: uid(), type: tp, no: tp.slice(0, 3).toUpperCase() + Math.floor(Math.random() * 1e6), expiry: tp === 'RC' ? t(ex[i]) : t(ex[i]), issue: t(ex[i] - 365), link: '' }); });
    v.fe.push({ id: uid(), type: 'ABC dry powder', cap: COMMERCIAL.test(type) ? '6 kg' : '2 kg', serial: 'FE-' + reg.slice(-3), last: t(fe - 90), next: t(fe) });
    for (let k = 0; k < 4; k++) v.fuel.push({ id: uid(), date: t(-k * 9), odo: v.odo - k * 420, litres: String(60 + Math.floor(Math.random() * 40)), amount: String(5800 + Math.floor(Math.random() * 3000)), station: 'IOCL Gajuwaka' });
    v.maint.push({ id: uid(), date: t(-75), odo: v.odo - 3500, kind: 'Periodic service', work: 'Oil, filters, greasing', cost: '8400', vendor: 'Authorised workshop', nextDate: t(15 + Math.floor(Math.random() * 60)), nextKm: String(v.odo + 1500) });
    S.local.push(v);

  saveLocal(); saveDrivers(); snapshot(); closeModal(); toast('Demo fleet loaded — remove it any time in Settings', 'good'); go('dashboard'); render();
}
function clearDemo() { S.local = S.local.filter(v => !v.demo); S.localDrivers = S.localDrivers.filter(d => !d.demo); saveLocal(); saveDrivers(); toast('Demo data removed', 'good'); render(); }

/* ════════════ Boot ════════════ */
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer); refreshTimer = null;
  if (S.settings.autoRefresh && (sheetUrl('v') || sheetUrl('d'))) refreshTimer = setInterval(() => { if (document.visibilityState === 'visible' && !new URLSearchParams(location.search).get('v')) syncSheet(true); }, Math.max(1, S.settings.refreshMin) * 60000);
  // display boards also redraw every minute so day counts roll over at midnight
}
setInterval(() => { if (route().page === 'display' && S.me) renderDisplay(); }, 60000);
function afterLogin() { snapshot(); checkNotify(); }
async function boot() {
  await ensureUsers(); restoreSession(); rebuild();
  if (!sheetUrl('v') && !sheetUrl('d')) S.sync = { state: 'off', msg: 'Google Sheet not linked', at: null };
  else if (S.sheet.at) S.sync = { state: 'ok', msg: 'Saved copy', at: S.sheet.at };
  render();
  const isPublic = new URLSearchParams(location.search).get('v') || new URLSearchParams(location.search).get('reg');
  if (!isPublic) { if (sheetUrl('v') || sheetUrl('d')) syncSheet(true); if (S.me) afterLogin(); startAutoRefresh(); }
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !window.__noSW) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__bip = e; });
}

boot();
